name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install --yes qt6-declarative-dev-tools jq qml6-module-qtqml qml6-module-qtquick qml6-module-qtquick-layouts
      - name: Locate qmllint
        run: echo "QMLLINT=$(dpkg -L qt6-declarative-dev-tools | grep '/qmllint$' | head -n 1)" >> "$GITHUB_ENV"
      - name: Run checks
        run: make check
